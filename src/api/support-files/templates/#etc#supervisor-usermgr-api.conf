[unix_http_server]
file=__BK_HOME__/logs/usermgr/supervisor.sock

[supervisord]
logfile=__BK_HOME__/logs/usermgr/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info
pidfile=__BK_HOME__/logs/usermgr/supervisord.pid
nodaemon=false
minfds=1024
minprocs=200

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix://__BK_HOME__/logs/usermgr/supervisor.sock

[program:usermgrapi]
directory=__BK_HOME__/usermgr/api
environment=
    PATH="__BK_HOME__/.envs/usermgr-api/bin/",
    DJANGO_SETTINGS_MODULE="bkuser_core.config.overlays.prod",
    LOGS_PATH="__BK_HOME__/logs",
command=__BK_HOME__/.envs/usermgr-api/bin/gunicorn wsgi -w 16 --max-requests 1024 --max-requests-jitter 50 --threads 2 --worker-class gevent -b :8009
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=__BK_HOME__/logs/usermgr/stdout.log
stdout_logfile_maxbytes = 50MB
stdout_logfile_backups = 10


[program:usermgrapi-worker]
directory=__BK_HOME__/usermgr/api
environment=
    PATH="__BK_HOME__/.envs/usermgr-api/bin/",
    DJANGO_SETTINGS_MODULE="bkuser_core.config.overlays.prod",
    LOGS_PATH="__BK_HOME__/logs",
command=__BK_HOME__/.envs/usermgr-api/bin/celery -A bkuser_core worker -l info --concurrency=8 --max-tasks-per-child=1 --without-gossip --without-mingle --without-heartbeat
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=__BK_HOME__/logs/usermgr/worker.log
stdout_logfile_maxbytes = 50MB
stdout_logfile_backups = 10


[program:usermgrapi-beat]
directory=__BK_HOME__/usermgr/api
environment=
    PATH="__BK_HOME__/.envs/usermgr-api/bin/",
    DJANGO_SETTINGS_MODULE="bkuser_core.config.overlays.prod",
    LOGS_PATH="__BK_HOME__/logs",
command=__BK_HOME__/.envs/usermgr-api/bin/celery -A bkuser_core beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=__BK_HOME__/logs/usermgr/beat.log
stdout_logfile_maxbytes = 50MB
stdout_logfile_backups = 10


[program:usermgrapi-worker-watchdog]
directory=__BK_HOME__/usermgr/api
environment=
    PATH="__BK_HOME__/.envs/usermgr-api/bin/:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",
    DJANGO_SETTINGS_MODULE="bkuser_core.config.overlays.prod",
    LOGS_PATH="__BK_HOME__/logs",
    BK_CELERY_WATCHDOG_RABBITMQ_HOST="__BK_USERMGR_RABBITMQ_HOST__",
    BK_CELERY_WATCHDOG_RABBITMQ_VHOST="__BK_USERMGR_RABBITMQ_VHOST__",
    BK_CELERY_WATCHDOG_RABBITMQ_USERNAME="__BK_USERMGR_RABBITMQ_USERNAME__",
    BK_CELERY_WATCHDOG_RABBITMQ_PASSWORD="__BK_USERMGR_RABBITMQ_PASSWORD__",
    BK_CELERY_WATCHDOG_SUPERVISOR_CONF="__BK_HOME__/etc/supervisor-usermgr-api.conf",
    BK_CELERY_WATCHDOG_STATE_DIR="__BK_HOME__/logs/usermgr/celery-watchdog",
    BK_CELERY_WATCHDOG_CHECK_SCRIPT="__BK_HOME__/usermgr/support-files/celery-watchdog/bk-celery-watchdog-check.sh",
    BK_CELERY_WATCHDOG_SUPERVISORCTL="__BK_HOME__/.envs/usermgr-api/bin/supervisorctl",
    BK_CELERY_WATCHDOG_PYTHON="__BK_HOME__/.envs/usermgr-api/bin/python"
command=/bin/bash -c "exec __BK_HOME__/usermgr/support-files/celery-watchdog/bk-celery-watchdog-loop.sh"
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=__BK_HOME__/logs/usermgr/worker-watchdog.log
stdout_logfile_maxbytes = 50MB
stdout_logfile_backups = 10
